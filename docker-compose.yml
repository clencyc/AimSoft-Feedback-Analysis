services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feedback_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-feedback_password}
      POSTGRES_DB: ${POSTGRES_DB:-feedback_analysis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedback_user -d feedback_analysis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_NAME: ${POSTGRES_DB:-feedback_analysis}
      DATABASE_USERNAME: ${POSTGRES_USER:-feedback_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-feedback_password}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    env_file: .env
    volumes:
      - ./backend:/app    
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  dashboard:
    build: ./dashboard
    env_file: .env
    volumes:
      - ./dashboard:/app
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:8000/api

volumes:
  pgdata: